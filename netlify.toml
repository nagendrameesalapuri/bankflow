[build]
  # --include=dev: Netlify also sets NODE_ENV=production during builds,
  # which makes npm skip devDependencies by default - vite, typescript, and
  # the Tailwind toolchain all live there and are required to build.
  command = "npm ci --include=dev && npm run build --workspace frontend"
  publish = "frontend/dist"

# BankFlow is a client-side-routed React SPA (React Router) - without this,
# a direct visit or refresh on any route other than "/" (e.g. /dashboard)
# would 404 instead of loading the app and letting the router take over.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
