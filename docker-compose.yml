services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bankflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankflow}
      POSTGRES_DB: ${POSTGRES_DB:-bankflow}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - bankflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bankflow}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bankflow}:${POSTGRES_PASSWORD:-bankflow}@postgres:5432/${POSTGRES_DB:-bankflow}
      USE_EMBEDDED_POSTGRES: 'false'
      AUTO_MIGRATE: 'true'
      AUTO_SEED_IF_EMPTY: 'true'
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      OTP_EXPIRES_IN_SECONDS: ${OTP_EXPIRES_IN_SECONDS:-120}
      OTP_LENGTH: ${OTP_LENGTH:-6}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
    ports:
      - '4000:4000'
    volumes:
      - bankflow_uploads:/app/backend/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_SOCKET_URL: ''
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  bankflow_pgdata:
  bankflow_uploads:
